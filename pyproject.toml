[project]
name = "escalator"
version = "0.1.0"
description = "Natural-language-to-SQL agent with small-to-frontier escalation routing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/escalator"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "data: integration gate that needs the pinned data under data/raw (run by make data-verify)",
    "slow: executes gold SQL over every task",
    "manifest: checks data/manifest.json against the pinned data (run by make manifest)",
]
